name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name=jx-${{ github.ref_name }}-${{ matrix.target }}
          mkdir $name
          cp target/${{ matrix.target }}/release/jx README.md $name/
          tar czf $name.tar.gz $name
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: jx-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum jx-*.tar.gz > SHA256SUMS
      - run: gh release create ${{ github.ref_name }} jx-*.tar.gz SHA256SUMS --generate-notes --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
